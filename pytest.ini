[pytest]
# Yerelde pytest hangi yöntemle başlatılırsa başlatılsın HTML raporu üret.
addopts =
    -vv
    --capture=tee-sys
    --html=reports/html/local-latest.html
    --self-contained-html
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --full-page-screenshot
    --output=test-results/playwright
